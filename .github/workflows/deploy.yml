name: Deploy CloudVault to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build React frontend
        working-directory: frontend
        run: |
          npm install
          echo "VITE_API_URL=http://13.234.183.182/api" > .env.production
          npm run build

      - name: Copy frontend to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "frontend/dist/*"
          target: "/var/www/cloudvault/"
          strip_components: 2

      - name: Deploy backend to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/CloudVault
            echo "Pulling latest code..."
            git pull origin main

            echo "Fixing frontend permissions..."
            sudo chmod -R 755 /var/www/cloudvault/

            echo "Rebuilding Docker container..."
            docker compose down
            docker compose up --build -d

            sleep 5
            echo "Deployment complete!"
            docker compose logs backend --tail=5
